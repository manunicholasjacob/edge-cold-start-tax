name: reproduce

# Recompute the headline findings from the released data in results/ and fail on drift.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headlines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install numpy==2.1.3
      - name: Regenerate STATS.txt from the measurement JSONs
        run: python scripts/compute_stats.py
      - name: Regenerated STATS.txt matches the committed one
        run: git diff --exit-code -- results/STATS.txt
      - name: README headline findings recompute from results/
        run: python scripts/check_headlines.py
